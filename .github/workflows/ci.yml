name: Verify Song Social

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: song_social
          POSTGRES_USER: song_social
          # Disposable CI service only; this is not a deployed credential.
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U song_social -d song_social"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Compile and run security/integration tests
        run: mvn -B -f apps/api/pom.xml verify
      - name: Verify real PostgreSQL and HTTP flows
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/song_social
          DATABASE_USERNAME: song_social
          DATABASE_PASSWORD: ci-only-password
        run: |
          set -euo pipefail
          java -jar apps/api/target/song-social-api-0.1.0.jar > /tmp/song-social-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          python scripts/smoke-api.py || { tail -n 120 /tmp/song-social-api.log; exit 1; }
      - name: Verify catalog SQL against PostgreSQL with rollback-only fixtures
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGDATABASE: song_social
          PGUSER: song_social
          PGPASSWORD: ci-only-password
        run: |
          python -m pip install 'psycopg[binary]==3.3.9'
          python tools/catalog/tests/integration_sql.py --disposable-database

  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/catalog/tests -v
      - run: python tools/catalog/catalog.py validate tools/catalog/catalog.empty.json
